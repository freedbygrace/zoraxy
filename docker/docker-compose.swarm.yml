# Docker Swarm deployment for Zoraxy with cluster replication
#
# Deploy with: docker stack deploy -c docker-compose.swarm.yml EdgeLoadBalancer
#
# This configuration enables:
# - 3 replica instances for high availability
# - Automatic peer discovery via DNS (tasks.EdgeLoadBalancer_zoraxy)
# - Cluster replication of proxy rules, certificates, and access rules
# - Bootstrap UI accessible at https://<node-ip>/admin/
# - Host-mode ports for direct client IP visibility
#
# Environment variables can be set in a .env file or passed directly

version: "3.8"

services:
  zoraxy:
    image: zoraxydocker/zoraxy:latest
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == worker
    ports:
      # Host mode for direct client IP visibility (no NAT through ingress)
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - zoraxy-config:/opt/zoraxy/config/
      - zoraxy-plugins:/opt/zoraxy/plugin/
      # Shared certificate storage (alternative to cluster replication)
      # Uncomment to use NFS or other shared storage for certificates:
      # - type: volume
      #   source: zoraxy-certs
      #   target: /opt/zoraxy/config/certs
      #   volume:
      #     driver: local
      #     driver_opts:
      #       type: nfs
      #       o: addr=nfs-server.example.com,rw,nfsvers=4
      #       device: ":/exports/zoraxy-certs"
    networks:
      - zoraxy-net
    environment:
      ###BEGIN GENERAL###
      TZ: "${TZ:-America/New_York}"
      FASTGEOIP: "${FASTGEOIP:-true}"
      DB: "${DB:-auto}"
      ENABLELOG: "${ENABLELOG:-true}"
      ###END GENERAL###

      ###BEGIN CLUSTER###
      CLUSTER: "${CLUSTER:-true}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      CLUSTER_PEERS: "${CLUSTER_PEERS:-}"
      ###END CLUSTER###

      ###BEGIN SWARM###
      # DNS format: tasks.<stack-name>_<service-name>
      # Deploy with: docker stack deploy -c docker-compose.swarm.yml EdgeLoadBalancer
      CLUSTER_SWARM: "${CLUSTER_SWARM:-true}"
      CLUSTER_SWARM_SERVICE: "${CLUSTER_SWARM_SERVICE:-tasks.EdgeLoadBalancer_zoraxy}"
      CLUSTER_SWARM_PORT: "${CLUSTER_SWARM_PORT:-8000}"
      CLUSTER_SWARM_SCHEME: "${CLUSTER_SWARM_SCHEME:-http}"
      ###END SWARM###

      ###BEGIN BOOTSTRAP###
      ZORAXY_ADMIN_USER: "${ZORAXY_ADMIN_USER:-admin}"
      ZORAXY_ADMIN_PASSWORD: "${ZORAXY_ADMIN_PASSWORD}"
      ZORAXY_BOOTSTRAP_UI: "${ZORAXY_BOOTSTRAP_UI:-true}"
      ###END BOOTSTRAP###

      ###BEGIN CERTIFICATES###
      AUTORENEW: "${AUTORENEW:-86400}"
      EARLYRENEW: "${EARLYRENEW:-30}"
      ###END CERTIFICATES###

      ###BEGIN MDNS###
      MDNS: "${MDNS:-true}"
      MDNSNAME: "${MDNSNAME:-}"
      ###END MDNS###

      ###BEGIN SECURITY###
      NOAUTH: "${NOAUTH:-false}"
      SSHLB: "${SSHLB:-false}"
      ###END SECURITY###

      ###BEGIN WEBSERVER###
      WEBFM: "${WEBFM:-true}"
      WEBROOT: "${WEBROOT:-./www}"
      ###END WEBSERVER###

      ###BEGIN ZEROTIER###
      ZEROTIER: "${ZEROTIER:-false}"
      ###END ZEROTIER###

      ###BEGIN PLUGINS###
      PLUGIN: "${PLUGIN:-/opt/zoraxy/plugin/}"
      ###END PLUGINS###

networks:
  zoraxy-net:
    driver: overlay
    attachable: true

volumes:
  zoraxy-config:
    driver: local
  zoraxy-plugins:
    driver: local

