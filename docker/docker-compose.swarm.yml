# Docker Swarm deployment for Zoraxy with cluster replication
#
# Deploy with: docker stack deploy -c docker-compose.swarm.yml EdgeLoadBalancer
#
# This configuration enables:
# - Global service (one instance per labeled node)
# - Automatic peer discovery via DNS (tasks.EdgeLoadBalancer_zoraxy)
# - Cluster replication of proxy rules, certificates, and access rules
# - Bootstrap UI accessible at https://<node-ip>/admin/
# - Host-mode ports for direct client IP visibility
#
# Prerequisites:
# 1. Label nodes that should run EdgeLoadBalancer:
#    docker node update --label-add EdgeLoadBalancer=true <node-name>
#
# 2. Create .env file from .env.example and set CLUSTER_SECRET and ZORAXY_ADMIN_PASSWORD
#
# Environment variables can be set in a .env file or passed directly

networks:
  zoraxy-net:
    driver: overlay
    attachable: true

services:
  zoraxy:
    image: zoraxydocker/zoraxy:latest
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == worker
          - node.platform.os == linux
          - node.labels.EdgeLoadBalancer == true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ${STACK_BINDMOUNTROOT:-/opt/zoraxy}/config/:/opt/zoraxy/config/
      - ${STACK_BINDMOUNTROOT:-/opt/zoraxy}/plugin/:/opt/zoraxy/plugin/
    networks:
      - zoraxy-net
    environment:
      TZ: "${TZ:-America/New_York}"
      FASTGEOIP: "${FASTGEOIP:-true}"
      DB: "${DB:-auto}"
      ENABLELOG: "${ENABLELOG:-true}"
      CLUSTER: "${CLUSTER:-true}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      CLUSTER_PEERS: "${CLUSTER_PEERS:-}"
      CLUSTER_SWARM: "${CLUSTER_SWARM:-true}"
      CLUSTER_SWARM_SERVICE: "${CLUSTER_SWARM_SERVICE:-tasks.EdgeLoadBalancer_Zoraxy}"
      CLUSTER_SWARM_PORT: "${CLUSTER_SWARM_PORT:-8000}"
      CLUSTER_SWARM_SCHEME: "${CLUSTER_SWARM_SCHEME:-http}"
      ZORAXY_ADMIN_USER: "${ZORAXY_ADMIN_USER:-admin}"
      ZORAXY_ADMIN_PASSWORD: "${ZORAXY_ADMIN_PASSWORD}"
      ZORAXY_BOOTSTRAP_UI: "${ZORAXY_BOOTSTRAP_UI:-true}"
      AUTORENEW: "${AUTORENEW:-86400}"
      EARLYRENEW: "${EARLYRENEW:-30}"
      MDNS: "${MDNS:-true}"
      MDNSNAME: "${MDNSNAME:-}"
      NOAUTH: "${NOAUTH:-false}"
      SSHLB: "${SSHLB:-false}"
      WEBFM: "${WEBFM:-true}"
      WEBROOT: "${WEBROOT:-./www}"
      ZEROTIER: "${ZEROTIER:-false}"
      PLUGIN: "${PLUGIN:-/opt/zoraxy/plugin/}"