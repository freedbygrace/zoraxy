# Docker Swarm deployment for Zoraxy with cluster replication
#
# Deploy with: docker stack deploy -c docker-compose.swarm.yml EdgeLoadBalancer
#
# This configuration enables:
# - 3 replica instances for high availability
# - Automatic peer discovery via DNS (tasks.EdgeLoadBalancer_zoraxy)
# - Cluster replication of proxy rules, certificates, and access rules
# - Bootstrap UI accessible at https://<node-ip>/admin/
# - Host-mode ports for direct client IP visibility
#
# Environment variables can be set in a .env file or passed directly

version: "3.8"

services:
  zoraxy:
    image: zoraxydocker/zoraxy:latest
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == worker
    ports:
      # Host mode for direct client IP visibility (no NAT through ingress)
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - zoraxy-config:/opt/zoraxy/config/
      - zoraxy-plugins:/opt/zoraxy/plugin/
      # Shared certificate storage (alternative to cluster replication)
      # Uncomment to use NFS or other shared storage for certificates:
      # - type: volume
      #   source: zoraxy-certs
      #   target: /opt/zoraxy/config/certs
      #   volume:
      #     driver: local
      #     driver_opts:
      #       type: nfs
      #       o: addr=nfs-server.example.com,rw,nfsvers=4
      #       device: ":/exports/zoraxy-certs"
    networks:
      - zoraxy-net
    environment:
      # General settings
      FASTGEOIP: "true"
      TZ: "${TZ:-Etc/UTC}"

      # Cluster settings - enable Swarm auto-discovery
      CLUSTER: "true"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      CLUSTER_SWARM: "true"
      # DNS format: tasks.<stack-name>_<service-name>
      # If deploying with: docker stack deploy -c docker-compose.swarm.yml EdgeLoadBalancer
      # The service becomes EdgeLoadBalancer_zoraxy, so use tasks.EdgeLoadBalancer_zoraxy
      CLUSTER_SWARM_SERVICE: "tasks.EdgeLoadBalancer_zoraxy"
      CLUSTER_SWARM_PORT: "8000"
      CLUSTER_SWARM_SCHEME: "http"

      # Bootstrap settings for headless deployment
      ZORAXY_ADMIN_USER: "${ZORAXY_ADMIN_USER:-admin}"
      ZORAXY_ADMIN_PASSWORD: "${ZORAXY_ADMIN_PASSWORD}"
      ZORAXY_BOOTSTRAP_UI: "true"

networks:
  zoraxy-net:
    driver: overlay
    attachable: true

volumes:
  zoraxy-config:
    driver: local
  zoraxy-plugins:
    driver: local

